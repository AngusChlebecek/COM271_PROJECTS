<!DOCTYPE html>
<head><title>Submit A Recipe!</title></head>
<body>
<form action="index.html">
    <label for="title">Recipe Title</label>
    <input type="text" name="title" maxlength="300">

    <br /><br />

    <textarea name="Ingredients" rows="10">Ingredients & Instructions</textarea>

    <br /><br />

    <label for="Easy">Easy</label>
    <input type="radio" name="Easy" >

    <label for="Medium">Medium</label>
    <input type="radio" name="Medium" >

    <label for="Hard">Hard</label>
    <input type="radio" name="Hard" >

    <br /><br />

    <label for="Vegetarian">Vegetarian</label>
    <input type="checkbox" name="Vegetarian">   
    
    <label for="Vegan">Vegan</label>
    <input type="checkbox" name="Vegan">

    <label for="GF">Gluten Free</label>
    <input type="checkbox" name="GF">

    <br /><br />

    <input type="submit"  name="Submit" value="Submit"/>
</form>
</body>


</html>
